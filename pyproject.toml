[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "track-telemetry-converter"
dynamic = ["version"]
description = "Convert motorsports telemetry logs to MoTeC LD/LDX files."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "BoYanZh" },
]
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
can = ["cantools>=39"]
fit = ["fitparse>=1.2"]
xrk = ["libxrk>=0.13"]
dlap = ["pycryptodome>=3.18"]
dev = [
  "cantools>=39",
  "fitparse>=1.2",
  "libxrk>=0.13",
  "pycryptodome>=3.18",
  "pytest>=8",
  "pytest-cov>=4",
  "ruff>=0.5",
]

[project.scripts]
track-telemetry = "track_telemetry_converter.cli:main"

[project.urls]
Repository = "https://github.com/BoYanZh/TrackTelemetryConverter"

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "track_telemetry_converter.__version__" }

[tool.setuptools.package-data]
"track_telemetry_converter._vendor" = ["LDParser.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
  "src/track_telemetry_converter/_vendor",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C901"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S314", "S603"]

[tool.pyright]
# Vendored third-party binary-format reader ships without type
# annotations; analyze it as an untyped dependency instead.
exclude = ["src/track_telemetry_converter/_vendor"]
# Check against the oldest supported runtime so newer syntax is caught.
pythonVersion = "3.10"

