name: test

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint with ruff
        run: ruff check src tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package with dev extras and pyright
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install pyright
      - name: Typecheck with pyright
        run: python -m pyright src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    # Golden snapshots encode Pacific wall-clock times (all fixture tracks
    # are in California); pin the reference frame so golden_verify passes
    # on any runner. TZ is honored on Linux; Windows needs tzutil.
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v7
      - name: Pin Pacific timezone (Windows)
        if: runner.os == 'Windows'
        run: tzutil /s "Pacific Standard Time"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify installed CLI
        run: |
          track-telemetry --help
          python -m track_telemetry_converter --help
      - name: Run tests
        run: python -m pytest -q
      - name: Verify golden snapshots
        run: python tests/golden_verify.py

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests with coverage gate
        run: >
          python -m pytest -q --cov=track_telemetry_converter
          --cov-report=term-missing --cov-fail-under=75
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Compile Python sources
        run: python -m compileall -q src tests
